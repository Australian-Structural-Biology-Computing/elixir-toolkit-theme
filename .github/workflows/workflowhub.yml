name: Update WorkflowHub data

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-workflowhub-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out website
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Check out WorkflowHub integration
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .workflowhub-theme

      - name: Update WorkflowHub data
        uses: ./.workflowhub-theme/.github/actions/workflowhub

      - name: Remove integration checkout
        shell: bash
        run: rm -rf -- .workflowhub-theme

      - name: Create or update pull request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: Update WorkflowHub workflow data
          title: Update WorkflowHub workflow data
          body: Automated refresh of validated WorkflowHub collection data.
          branch: automation/update-workflowhub-data
          base: ${{ github.event.repository.default_branch }}
          add-paths: _data/data_workflows.yaml
          delete-branch: true
